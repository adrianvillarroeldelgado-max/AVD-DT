name: Compilar app Android

# Solo hace falta compilar cuando cambia la app nativa (carpeta android) o a mano.
# Los cambios de la web llegan solos a la app: abre https://adrianvillarroeldelgado-max.github.io/avd-dt/
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Comprobar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos de la clave de firma (Settings > Secrets and variables > Actions). Añádelos y vuelve a ejecutar."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Copiar la web dentro de la app (copia de respaldo)
        run: |
          rsync -a --exclude android --exclude .github --exclude .git --exclude README.md ./ android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/LEEME.txt

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK y AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Preparar archivos
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk salida/PizarraDTFutbol.apk
          cp android/app/build/outputs/bundle/release/app-release.aab salida/PizarraDTFutbol.aab

      - name: Guardar en Actions
        uses: actions/upload-artifact@v4
        with:
          name: PizarraDTFutbol-${{ github.run_number }}
          path: salida/*

      - name: Publicar en Releases (enlace fijo para descargar el APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pizarra D.T Fútbol 1.0.${{ github.run_number }}
          body: |
            Instala **PizarraDTFutbol.apk** en Android 7 o superior.
            La app abre la web publicada y se actualiza sola con cada cambio de la web.
            **PizarraDTFutbol.aab** es para Google Play.
          files: |
            salida/PizarraDTFutbol.apk
            salida/PizarraDTFutbol.aab
          make_latest: true
